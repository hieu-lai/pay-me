    clients.client_business_request:
      type: object
      required:
      - australian_business_number
      - business_names
      - business_registration_date
      - legal_name
      - merchant_category_code
      - registered_address
      - risk_level
      - services
      - type
      - website_url
      additionalProperties: false
      properties:
        austrac_number:
          type: string
          description: The AUSTRAC number of the client (if applicable).
          example: '1234567'
        australian_business_number:
          type: string
          description: The Australian Business Number (ABN) of the client.
          example: '12345678901'
          minLength: 11
          maxLength: 11
          pattern: "^\\d+$"
        australian_company_number:
          type: string
          description: The Australian Company Number(ACN) of the client. Corresponding
            `company_incorporation_date` is required when provided.
          example: '045678901'
          minLength: 9
          maxLength: 9
          pattern: "^\\d+$"
        australian_credit_licence:
          type: string
          description: The Australian Credit Licence of the client (if applicable).
          example: '123456'
        australian_financial_services_licence:
          type: string
          description: The Australian Financial Services Licence of the client (if
            applicable).
          example: '777888999'
        business_names:
          type: array
          description: The business/trading names registered to the client's legal
            entity.
          items:
            type: string
          example:
          - Business Name 1
          - Business Name 2
        business_registration_date:
          type: string
          description: The business registration date of the client.
          format: date
          example: '2025-02-01'
        company_incorporation_date:
          type: string
          description: The company incorporation date of the client, must correspond
            to ACN registration.
