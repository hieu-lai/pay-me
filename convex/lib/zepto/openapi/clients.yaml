security:
- bearerAuth: []
paths:
  "/clients":
    post:
      summary: Create Client
      tags:
      - Clients
      description: |
        The Zepto Clients API allows registration of clients who indirectly use the Zepto platform
        via your Zepto integration.

        Merchants are required to keep their sub-client details up to date with Zepto via the update client endpoint.
      parameters: []
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/clients.client_response"
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              examples:
                Generic validation error:
                  summary: Generic validation error
                  value:
                    errors:
                    - title: Validation Failed
                      detail: params.type is missing
              schema:
                "$ref": "#/components/schemas/clients.errors"
        '401':
          description: unauthorized
          content:
            application/json:
              examples:
                Unauthorised access token:
                  summary: Unauthorised access token
                  value:
                    errors:
                    - title: Unauthorised access token
                      detail: Access token is expired or not valid
                      links:
                        about: https://docs.zeptopayments.com/docs/zepto-api#authentication-and-authorisation
              schema:
                "$ref": "#/components/schemas/clients.errors"
        '403':
          description: forbidden
        '500':
          description: Internal Server Error
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/clients.client_request"
    get:
      summary: List Clients
      tags:
      - Clients
      parameters:
      - name: per_page
        description: Number of results per page
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: starting_after
        description: Opaque pagination cursor value. Set by following "next" links.
        in: query
        schema:
          type: string
      - name: legal_name
        description: Filter clients by legal name. The filtering is case insensitive
          and must match the beginning of the provided legal name.
        in: query
        schema:
          type: string
      - name: australian_business_number
        description: Filter clients by ABN.
        in: query
        schema:
          type: string
      responses:
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              examples:
                Non integer per_page:
                  summary: Non integer per_page
                  value:
                    errors:
                    - title: Invalid request parameters
                      detail: The `per_page` param is not valid.
                No record with ID matching starting_after param:
                  summary: No record with ID matching starting_after param
                  value:
                    errors:
                    - title: Invalid request parameters
                      detail: Could not find a record for the given `starting_after`
                        param.
              schema:
                "$ref": "#/components/schemas/clients.errors"
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/clients.list"
        '401':
          description: unauthorized
          content:
            application/json:
              examples:
                Unauthorised access token:
                  summary: Unauthorised access token
                  value:
                    errors:
                    - title: Unauthorised access token
                      detail: Access token is expired or not valid
                      links:
                        about: https://docs.zeptopayments.com/docs/zepto-api#authentication-and-authorisation
              schema:
                "$ref": "#/components/schemas/clients.errors"
        '403':
          description: forbidden
        '500':
          description: Internal Server Error
    parameters:
    - "$ref": "#/components/parameters/ZeptoAPIVersion"
  "/clients/{client_id}":
    parameters:
    - "$ref": "#/components/parameters/ZeptoAPIVersion"
    - name: client_id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Show Client
      tags:
      - Clients
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/clients.client_response"
        '404':
          description: Not Found
        '401':
          description: unauthorized
          content:
            application/json:
              examples:
                Unauthorised access token:
                  summary: Unauthorised access token
                  value:
                    errors:
                    - title: Unauthorised access token
                      detail: Access token is expired or not valid
                      links:
                        about: https://docs.zeptopayments.com/docs/zepto-api#authentication-and-authorisation
              schema:
                "$ref": "#/components/schemas/clients.errors"
        '403':
          description: forbidden
        '500':
          description: Internal Server Error
    patch:
      summary: Update Client
      tags:
      - Clients
      description: There are certain attributes that cannot be updated here such as
        the ABN, ACN and MCC. Please reach out to the Zepto Compliance team (compliance@zepto.com.au)
        to have them updated.
      parameters: []
      responses:
        '202':
          description: accepted
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/clients.errors"
        '404':
          description: not found
        '401':
          description: unauthorized
          content:
            application/json:
              examples:
                Unauthorised access token:
                  summary: Unauthorised access token
                  value:
                    errors:
                    - title: Unauthorised access token
                      detail: Access token is expired or not valid
                      links:
                        about: https://docs.zeptopayments.com/docs/zepto-api#authentication-and-authorisation
              schema:
                "$ref": "#/components/schemas/clients.errors"
        '403':
          description: forbidden
        '500':
          description: Internal Server Error
      requestBody:
        content:
          application/json:
            schema:
              type: object
              "$ref": "#/components/schemas/clients.client_update_request"
servers:
- description: Zepto Sandbox
  url: https://api.sandbox.zeptopayments.com
- description: Zepto Production
  url: https://api.zeptopayments.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ZeptoAPIVersion:
      name: Zepto-API-Version
      in: header
      required: false
      schema:
        type: string
        pattern: "^\\d{8}$"
        default: '20250101'
        example: '20260101'
      description: API version in YYYYMMDD format. Defaults to 20250101 (legacy) when
        omitted.
  schemas:
    clients.client:
      type: object
      additionalProperties: false
      properties:
        australian_business_number:
          type: string
          description: The Australian Business Number (ABN) of the client.
          example: '12345678901'
          minLength: 11
          maxLength: 11
          pattern: "^\\d+$"
        australian_company_number:
          type: string
          description: The Australian Company Number (ACN) of the client.
          example: '045678901'
          minLength: 9
          maxLength: 9
          pattern: "^\\d+$"
        australian_credit_licence:
          type: string
          description: The Australian Credit Licence of the client (if applicable).
          example: '123456'
        australian_financial_services_licence:
          type: string
          description: The Australian Financial Services Licence of the client (if
            applicable).
          example: '777888999'
        austrac_number:
          type: string
          description: The AUSTRAC number of the client (if applicable).
          example: '1234567'
        business_names:
          type: array
          description: The business/trading names registered to the client's legal
            entity. For `individual` clients, this should be the client's legal name.
          items:
            type: string
          example:
          - Business Name 1
          - Business Name 2
        business_registration_date:
          type: string
          description: The business registration date of the client.
          format: date
          example: '2025-02-01'
        company_incorporation_date:
          type: string
          description: The company incorporation date of the client.
          format: date
          example: '2025-02-01'
        contact_information:
          type: object
          description: The contact information of the client. Required if RTP services
            requested.
          properties:
            contact_name:
              type: string
              description: 'The contact name for the client. Required if RTP services
                requested. '
              example: Contact Name
            email:
              type: string
              description: The contact email address for the client. Required if RTP
                services requested.
              example: contact@example.com
            phone:
              type: string
              description: The contact phone number for the client. Required if RTP
                services requested.
              example: "+61400123456"
              pattern: "^[\\d\\s\\-+()]+$"
        id:
          type: string
          description: The unique identifier of the client (UUIDv7).
          example: '01955dea-b445-7841-a145-77b4b2c00089'
        legal_name:
          type: string
          description: The legal name of the client.
          example: Legal Name Pty Ltd
        merchant_category_code:
          type: string
          description: The Merchant Category Code (MCC) of the client.
